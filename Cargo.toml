[package]
name = "rsksw2"
version = "0.1.1"
edition = "2024"
description = "Rust port of the KSW2 pairwise sequence alignment library"
license = "MIT"
repository = "https://github.com/keithyin/rsksw2"
documentation = "https://docs.rs/rsksw2"
keywords = ["alignment", "bioinformatics", "ksw2", "sequence", "sse"]
categories = ["science::bioinformatics", "algorithms"]
# ksw2/ 下的 C 参考实现随仓库保留，但编译产物（.o、C 版二进制）不进入 crate
exclude = ["ksw2/*.o", "ksw2/ksw2-test", "target/"]

[features]
default = ["cli"]
# the ksw2-test command line program (reads gzip-compressed FASTA)
cli = ["dep:flate2"]

[dependencies]
flate2 = { version = "1", optional = true }

[[bin]]
name = "ksw2-test"
path = "src/bin/ksw2-test.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
