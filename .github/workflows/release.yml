name: Release

on:
  push:
    tags: ["v*"]
  # 失败后不需要删 tag 重打：到 Actions 页面选中该 tag 手动重跑即可。
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 的发布串行执行，不互相取消，避免并发写同一个 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 直接复用 ci.yml，tag 发布前必须先通过同一套构建/测试/lint。
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Must be triggered on a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::请在 Actions 页面选择 v* tag 作为 ref 运行（当前为 $GITHUB_REF）"
              exit 1
              ;;
          esac

      - name: Tag must match Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只发布 x86_64：SSE 入口（ksw_*_sse）与 C 源码一样只在 x86_64 编译，
        # 非 x86_64 目标无法构建 ksw2-test 这个 CLI。
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --release

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../rsksw2-${{ matrix.target }}.tar.gz ksw2-test
          cd ../../..
          shasum -a 256 rsksw2-${{ matrix.target }}.tar.gz > rsksw2-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/ksw2-test.exe -DestinationPath rsksw2-${{ matrix.target }}.zip
          (Get-FileHash rsksw2-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() | Out-File rsksw2-${{ matrix.target }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsksw2-${{ matrix.target }}
          path: |
            rsksw2-${{ matrix.target }}.tar.gz*
            rsksw2-${{ matrix.target }}.zip*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 显式指定 tag，重跑时会更新已有 Release 而不是新建
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check whether this version is already on crates.io
        id: check
        run: |
          crate="$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)"
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'rsksw2-release-workflow' \
            "https://crates.io/api/v1/crates/${crate}/${version}")"
          echo "crates.io ${crate}@${version} -> HTTP ${code}"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${crate} ${version} 已发布过，跳过 cargo publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run
        if: steps.check.outputs.published == 'false'
        run: cargo publish --locked --dry-run

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
